[package]
name = "sonora"
version = "0.10.2"
edition = "2024"

[dependencies]
iced = { version = "0.14", features = ["image", "tokio"] }
id3 = "1.16.3"
rodio = "0.21.1"
symphonia = { version = "0.5.5", features = [
    "mp3",
    "flac",
    "wav",
    "ogg",
    "vorbis",
    "aac",
    "isomp4",
] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.14"
