name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Package app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package/Sonora/assets | Out-Null
          Copy-Item "target/release/sonora.exe" "package/Sonora/"
          Copy-Item "assets/*" "package/Sonora/assets/" -Recurse -Force
          Compress-Archive -Path "package/Sonora" -DestinationPath "sonora-windows-x64.zip" -Force

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: sonora-windows-x64.zip
          prerelease: true
